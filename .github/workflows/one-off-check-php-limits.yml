name: One-off - Production diagnostics (PHP limits + task/milestone perms)

# TEMPORARY, READ-ONLY diagnostic workflow — checks actual PHP-FPM upload
# limits and task/milestone permission state on production, then deleted.
# No writes of any kind.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run production diagnostics
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/mgeengco/app.mge-eng.com/
            echo "=== php -i (CLI) ==="
            php -i | grep -E "upload_max_filesize|post_max_size|max_execution_time|memory_limit" || true
            echo "=== php artisan tinker ini_get (actual FPM-ish via artisan, same binary as CLI though) ==="
            php artisan tinker --execute="echo 'upload_max_filesize='.ini_get('upload_max_filesize').PHP_EOL; echo 'post_max_size='.ini_get('post_max_size').PHP_EOL;" || true
            echo "=== look for .user.ini already present ==="
            find . -maxdepth 2 -iname ".user.ini" -exec echo "found: {}" \; -exec cat {} \;
            echo "=== php-fpm ini location ==="
            php --ini
            echo "=== recent laravel.log entries mentioning tasks/milestones ==="
            tail -n 500 storage/logs/laravel.log 2>/dev/null | grep -i "task\|milestone" | tail -30 || echo "no matches"
            echo "=== admin role/permission sanity check (read-only) ==="
            php artisan tinker --execute="
                \$u = App\Models\User::where('email', 'admin@mge-pms.test')->first();
                echo 'user found: '.(\$u ? 'yes' : 'no').PHP_EOL;
                if (\$u) {
                    echo 'roles: '.\$u->roles->pluck('name')->implode(',').PHP_EOL;
                    echo 'has tasks.create (direct+role): '.(\$u->can('tasks.create') ? 'yes' : 'no').PHP_EOL;
                    echo 'has projects.edit (direct+role): '.(\$u->can('projects.edit') ? 'yes' : 'no').PHP_EOL;
                }
                echo 'total users: '.App\Models\User::count().PHP_EOL;
                echo 'total projects: '.App\Models\Project::count().PHP_EOL;
            "
