name: Deploy to cPanel

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/mgeengco/app.mge-eng.com/

            # 1. Pull latest code FIRST.
            #    Deliberately before any cleanup. This step reaches out to
            #    GitHub and can fail on a transient network problem — it did on
            #    7 Sep 2026, when the server could not reach github.com:443.
            #    Anything destructive that runs before it turns a failed deploy
            #    into a broken site: assets were deleted, the pull failed, and
            #    production served no CSS or JS until the deploy was re-run.
            #    A deploy that fails must leave the site exactly as it was.
            git fetch origin
            git reset --hard origin/main

            # 1b. Remove build assets left over from older deploys.
            #     git reset --hard has already restored every committed asset, so
            #     whatever remains untracked here is stale. git clean removes
            #     exactly those, scoped to this one directory.
            #     Vite hashes file names, so a stale file can never be served in
            #     place of a current one — this is housekeeping, not correctness,
            #     which is why it is safe to run after the pull rather than
            #     before it.
            echo "Removing stale build assets..."
            git clean -fdx public/build/assets

            # 2. Install Dependencies (production only)
            if command -v composer &> /dev/null
            then
                composer install --no-dev --optimize-autoloader --no-interaction
            fi

            # 3. Fix Permissions
            chmod -R 775 storage bootstrap/cache

            # 4. Clear ALL Laravel Caches FIRST
            if [ -f "artisan" ]; then
                php artisan optimize:clear
                php artisan cache:clear
                php artisan config:clear
                php artisan route:clear
                php artisan view:clear

                # 5. Run Migrations
                php artisan migrate --force --no-interaction

                # 5b. Provision leave policy reference data.
                #     Both seeders are idempotent (firstOrCreate), so re-running
                #     on every deploy is safe and will never overwrite a value HR
                #     has tuned. Without this the policy tables stay empty on the
                #     server, because migrations alone do not populate them.
                php artisan db:seed --class=LeavePolicySeeder --force --no-interaction
                php artisan db:seed --class=PublicHolidaySeeder --force --no-interaction

                # 6. Storage link (idempotent)
                php artisan storage:link --force 2>/dev/null || true

                # 7. Re-cache for production
                php artisan config:cache
                php artisan route:cache
                php artisan view:cache
            fi

            echo "Deployment complete!"
