name: One-off - Check web server upload limits

# TEMPORARY, READ-ONLY diagnostic — checks web server type and any
# request-body size limits beyond PHP's own config, then deleted.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check web server and body-size limits
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/mgeengco/app.mge-eng.com/
            echo "=== web server / cPanel hints ==="
            (which whmapi1 && echo "WHM available") || echo "no whmapi1"
            cat /etc/apache2/conf/httpd.conf 2>/dev/null | grep -i "LimitRequestBody\|LiteSpeed" | head -5 || echo "no httpd.conf access"
            ps aux 2>/dev/null | grep -i "litespeed\|apache\|nginx" | grep -v grep | head -5 || echo "no ps access"
            echo "=== existing .htaccess LimitRequestBody in public/ ==="
            grep -i "LimitRequestBody\|MaxRequestBody" public/.htaccess 2>/dev/null || echo "none found"
            echo "=== disk free space (relevant for GB-scale uploads) ==="
            df -h . 2>/dev/null || echo "no df access"
            echo "=== PHP-FPM / CGI max execution & upload settings currently active ==="
            php -i | grep -E "Server API|upload_max_filesize|post_max_size|max_execution_time|max_input_time|memory_limit" || true
