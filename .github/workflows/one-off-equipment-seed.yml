name: One-off - Seed Equipment & Machinery

# TEMPORARY workflow — manually triggered exactly once to run
# EquipmentMachineryImportSeeder on production, then deleted. Not part of
# the regular deploy pipeline. Reuses the same SSH secrets/action as
# deploy.yml because that is the only trusted path to the production host.

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Run EquipmentMachineryImportSeeder on production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/mgeengco/app.mge-eng.com/
            php artisan db:seed --class=EquipmentMachineryImportSeeder --force --no-interaction
            echo "Equipment seeding complete."
