; Raised for technical drawing uploads (Contract Drawings + Project
; Documents), which can reach several GB. Standard per-directory PHP
; override for shared/cPanel hosting where the system php.ini isn't
; directly editable — PHP re-reads .user.ini periodically (no restart
; needed) as long as the PHP-FPM pool allows user_ini overrides.
upload_max_filesize = 5120M
post_max_size = 5200M
max_execution_time = 1800
max_input_time = 3600
memory_limit = 2048M
